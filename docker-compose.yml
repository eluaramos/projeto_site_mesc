services:
    laravel.test:
        image: 'sail-8.3/app'
        build:
            context: .
            dockerfile: .devcontainer/Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - 'cms-media:/var/www/html/storage/app/cms-media'
            - './.devcontainer/cms-upload.ini:/etc/php/8.3/cli/conf.d/99-cms-upload.ini:ro'
        networks:
            - sail
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-mesc_dev}'
            POSTGRES_USER: '${DB_USERNAME:-mesc}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-mesc_dev}'
        volumes:
            - 'postgres-data:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${DB_USERNAME:-mesc} -d ${DB_DATABASE:-mesc_dev}
            interval: 5s
            timeout: 5s
            retries: 10

networks:
    sail:
        driver: bridge

volumes:
    cms-media:
        driver: local
    postgres-data:
        driver: local